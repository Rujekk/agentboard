[package]
name = "agentboard"
version = "0.1.0"
description = "On-chain guestbook & reputation board for AI agents"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "agentboard"

[features]
no-entrypoint = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
